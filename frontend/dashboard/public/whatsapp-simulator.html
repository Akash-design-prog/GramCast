<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GramCast — WhatsApp Simulator (demo fallback)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --wa-green: #075E54;
    --wa-green-light: #128C7E;
    --wa-bg: #ECE5DD;
    --wa-bubble-in: #FFFFFF;
    --wa-bubble-out: #DCF8C6;
    --wa-text: #111B21;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b141a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .disclosure {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #b45309;
    color: #fff;
    text-align: center;
    font-size: 13px;
    padding: 6px 12px;
    z-index: 10;
  }
  .phone {
    width: 380px;
    height: 720px;
    background: var(--wa-bg);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    margin-top: 34px;
  }
  .header {
    background: var(--wa-green);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--wa-green-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .header-text .name { font-weight: 600; font-size: 15px; }
  .header-text .status { font-size: 12px; opacity: 0.85; }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 78%;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    color: var(--wa-text);
    white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
  }
  .bubble.farmer {
    align-self: flex-end;
    background: var(--wa-bubble-out);
    border-top-right-radius: 2px;
  }
  .bubble.bot {
    align-self: flex-start;
    background: var(--wa-bubble-in);
    border-top-left-radius: 2px;
  }
  .bubble audio { width: 220px; margin-top: 6px; display: block; }
  .bubble.pending { opacity: 0.6; font-style: italic; }

  .composer {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #f0f0f0;
  }
  .composer input[type=text] {
    flex: 1;
    border: none;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .composer button {
    background: var(--wa-green);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 16px;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }

  .settings {
    width: 380px;
    margin-top: 12px;
    background: #1a1f24;
    color: #9aa5ab;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
  }
  .settings label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .settings input, .settings select {
    flex: 1;
    background: #0f1418;
    color: #e9edef;
    border: 1px solid #2a3339;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="disclosure">
    Simulated WhatsApp interface — real backend forecast/advisory/voice-note logic, not the actual WhatsApp app.
    Used only as a demo fallback until real Meta Cloud API credentials are wired in.
  </div>

  <div>
    <div class="phone">
      <div class="header">
        <div class="avatar">🌾</div>
        <div class="header-text">
          <div class="name">GramCast</div>
          <div class="status">Panchayat rainfall bot</div>
        </div>
      </div>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <input type="text" id="messageInput" placeholder="Type a village name or 'weather'..." />
        <button id="sendBtn" title="Send">➤</button>
      </div>
    </div>

    <div class="settings">
      <label>Backend URL <input type="text" id="apiBase" value="http://localhost:8001" /></label>
      <label>Sender phone (E.164, no '+') <input type="text" id="fromPhone" value="919876543210" /></label>
    </div>
  </div>

<script>
  const thread = document.getElementById("thread");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const apiBaseInput = document.getElementById("apiBase");
  const fromPhoneInput = document.getElementById("fromPhone");

  function addBubble(text, who, opts = {}) {
    const div = document.createElement("div");
    div.className = "bubble " + who + (opts.pending ? " pending" : "");
    div.textContent = text;
    if (opts.audioBase64) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = `data:${opts.audioMediaType};base64,${opts.audioBase64}`;
      div.appendChild(audio);
    }
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;

    addBubble(text, "farmer");
    const pending = addBubble("...", "bot", { pending: true });

    try {
      const apiBase = apiBaseInput.value.trim().replace(/\/$/, "");
      const res = await fetch(`${apiBase}/whatsapp/simulate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from: fromPhoneInput.value.trim(), text }),
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      const data = await res.json();
      pending.remove();
      addBubble(data.reply_text, "bot", {
        audioBase64: data.audio_base64,
        audioMediaType: data.audio_media_type,
      });
    } catch (err) {
      pending.remove();
      addBubble(`Could not reach the backend at ${apiBaseInput.value} - is it running? (${err.message})`, "bot");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  addBubble("Hi! Reply with your village name, or 'weather' for today's forecast (if you're a registered farmer).", "bot");
</script>
</body>
</html>
